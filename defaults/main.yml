---

state: present
nvidia_gpu_vars_file: null
nvidia_gpu_local_mirror: null

nvidia_gpu_version: 615
nvidia_gpu_version_debian: 550.163.01-2  # older version

nvidia_gpu_driver_packages:
  almalinux:
    - "nvidia-open-{{ nvidia_gpu_version }}"
    - "nvidia-driver-cuda-{{ nvidia_gpu_version }}"  # contains nvidia-smi
  rocky:
    - "nvidia-open-{{ nvidia_gpu_version }}"
  centos:
    - "nvidia-open-{{ nvidia_gpu_version }}"  # use same as rocky
  ubuntu:
    - "nvidia-driver-{{ nvidia_gpu_version }}-open"
  debian:
    - "nvidia-driver={{ nvidia_gpu_version_debian }}"
    - "nvidia-kernel-dkms={{ nvidia_gpu_version_debian }}"

...
