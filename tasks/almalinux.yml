---

# https://wiki.almalinux.org/documentation/nvidia.html#installation-of-gpu-driver

- name: Ensure driver repo is available
  become: true
  ansible.builtin.dnf:
    name: almalinux-release-nvidia-driver

- name: Configure local repo
  when: nvidia_gpu_local_mirror is defined
  block:
    - name: Configure local repository
      become: true
      when: nvidia_gpu_local_mirror is defined
      vars:
        local_repo: nvidia_gpu_local_mirror
      ansible.builtin.yum_repository:
        name: "{{ local_repo.prefix | lower }}-{{ local_repo.name | lower }}"
        description: "{{ local_repo.prefix }} {{ ansible_facts.ansible_distribution }} $releasever - {{ local_repo.name }}"
        file: "nvidia-{{ local_repo.name }}-{{ local_repo.prefix | lower }}"
        baseurl: "{{ nvidia_gpu_local_mirror }}/{{ local_repo.path }}"
        gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/GPGKEY"
        gpgcheck: "{{ local_repo.gpgcheck | default(true) }}"
        repo_gpgcheck: "{{ local_repo.repo_gpgcheck | default(true) }}"
        enabled: "{{ local_repo.enabled | default(true) }}"
        countme: "{{ local_repo.countme | default(true) }}"
        retries: "{{ local_repo.retries | default(1) }}"
        timeout: "{{ local_repo.timeout | default(1) }}"
        cost: "{{ local_repo.cost | default(100) }}"
        priority: "{{ local_repo.priority | default(omit) }}"
        metadata_expire: "{{ local_repo.metadata_expire | default('6h') }}"
        skip_if_unavailable: "{{ local_repo.skip_if_unavailable | true }}"
        mode: "0644"
        owner: "root"
        group: "root"
        state: present
      register: yum_repo_setup

    - name: Clean dnf cache
      become: true
      when: yum_repo_setup.changed  # noqa: no-handler
      ansible.builtin.command:
        cmd: dnf clean all
      register: dnf_clean_result
      changed_when: dnf_clean_result.rc == 0

    - name: Update dnf metadata cache
      become: true
      ansible.builtin.dnf:
        update_cache: true

- name: Install driver packages
  become: true
  ansible.builtin.dnf:
    name: "{{ nvidia_gpu_driver_packages.almalinux }}"
  notify:
    - Rebuild initramfs
    - Reboot Host

...
