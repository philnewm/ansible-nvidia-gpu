---

# https://wiki.almalinux.org/documentation/nvidia.html#installation-of-gpu-driver

- name: Ensure driver repo is available
  become: true
  ansible.builtin.dnf:
    name: almalinux-release-nvidia-driver
    state: present
  register: cuda_repo

- name: Configure local repository
  become: true
  vars:
    local_repo: "{{ nvidia_gpu_local_mirror }}"
  when: nvidia_gpu_local_mirror != None
  ansible.builtin.yum_repository:
    name: "{{ local_repo.name }}"
    description: "{{ local_repo.description }}"
    file: "{{ local_repo.file }}"
    baseurl: "{{ local_repo.base_url }}"
    gpgkey: "{{ local_repo.gpgkey }}"
    gpgcheck: "{{ local_repo.gpgcheck | default(true) }}"
    repo_gpgcheck: "{{ local_repo.repo_gpgcheck | default(true) }}"
    enabled: "{{ local_repo.enabled | default(true) }}"
    countme: "{{ local_repo.countme | default(true) }}"
    retries: "{{ local_repo.retries | default(1) }}"
    timeout: "{{ local_repo.timeout | default(1) }}"
    cost: "{{ local_repo.cost | default(100) }}"
    priority: "{{ local_repo.priority | default(omit) }}"
    metadata_expire: "{{ local_repo.metadata_expire | default('6h') }}"
    skip_if_unavailable: "{{ local_repo.skip_if_unavailable | default(true) }}"
    mode: "0644"
    owner: "root"
    group: "root"
    state: present
  register: cuda_repo

- name: Clean dnf cache
  become: true
  when: cuda_repo.changed  # noqa: no-handler
  ansible.builtin.command:
    cmd: dnf clean all
  register: dnf_clean_result
  changed_when: dnf_clean_result.rc == 0

- name: Install driver packages
  become: true
  ansible.builtin.dnf:
    name: "{{ nvidia_gpu_driver_packages.almalinux }}"
    update_cache: true
  notify:
    - Rebuild initramfs
    - Reboot Host

...
